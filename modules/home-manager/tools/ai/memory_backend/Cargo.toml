[package]
name = "pi-memory-backend"
version = "0.1.0"
edition = "2024"
description = "Local memory backend for Pi, intended to run as a long-lived stdio subprocess"
license = "MIT"

[dependencies]
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "ndarray", "tracing", "api-24"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokenizers = { version = "0.22.1", default-features = false, features = ["onig"] }
